<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Function Visualizer</title>
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h1>📊 3D Function Visualizer</h1>

    <div class="control-group">
      <div class="input-row">
        <label for="function-input">Function f(x, y) = </label>
        <button id="math-help-toggle" class="help-btn" title="Available functions & symbols">?</button>
      </div>
      <input type="text" id="function-input" placeholder="e.g., sin(x)*cos(y)" value="sin(x)*cos(y)" />

      <div id="math-help-popup" hidden>
        <p class="help-section">Functions</p>
        <p class="help-list">
          <code>abs</code><code>acos</code><code>asin</code><code>atan</code><code>cbrt</code><code>ceil</code><code>cos</code><code>exp</code><code>floor</code><code>log</code><code>log2</code><code>log10</code><code>max</code><code>min</code><code>pow</code><code>round</code><code>sign</code><code>sin</code><code>sqrt</code><code>tan</code><code>trunc</code>
        </p>
        <p class="help-section">Constants</p>
        <p class="help-list"><code>PI</code><code>E</code></p>
        <p class="help-section">Operators</p>
        <p class="help-list"><code>+ - * / % ** ( )</code></p>
      </div>
    </div>

    <div class="control-group">
      <label for="domain-x">X Domain</label>
      <div class="slider-row">
        <input type="range" id="domain-x-min" min="-10" max="10" step="0.5" value="-5" />
        <span class="value-display"><span id="x-min-val">-5</span></span>
      </div>
      <div class="slider-row">
        <input type="range" id="domain-x-max" min="-10" max="10" step="0.5" value="5" />
        <span class="value-display"><span id="x-max-val">5</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="domain-y">Y Domain</label>
      <div class="slider-row">
        <input type="range" id="domain-y-min" min="-10" max="10" step="0.5" value="-5" />
        <span class="value-display"><span id="y-min-val">-5</span></span>
      </div>
      <div class="slider-row">
        <input type="range" id="domain-y-max" min="-10" max="10" step="0.5" value="5" />
        <span class="value-display"><span id="y-max-val">5</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="resolution">Resolution (samples)</label>
      <div class="slider-row">
        <input type="range" id="resolution" min="10" max="200" step="5" value="30" />
        <span class="value-display"><span id="res-val">30</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="color-mode">Color Mode</label>
      <select id="color-mode">
        <option value="height">By Height (Z)</option>
        <option value="gradient">Gradient (Blue→Red)</option>
        <option value="wireframe">Wireframe Only</option>
      </select>
    </div>

    <div class="control-group">
      <label for="opacity">Surface Opacity</label>
      <div class="slider-row">
        <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.85" />
        <span class="value-display"><span id="op-val">0.85</span></span>
      </div>
    </div>

    <div class="btn-group">
      <button id="reset-view">Reset View</button>
      <button id="auto-rotate">▶ Auto Rotate</button>
    </div>

    <div class="info-panel" id="info-panel">Function: sin(x)*cos(y)</div>

    <p class="hint">🖱️ Drag to orbit • Scroll / +/- to zoom • R = reset view</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
