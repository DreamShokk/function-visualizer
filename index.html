<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Function Visualizer</title>
  <!-- Three.js from CDN -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: #1a1a2e;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 340px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 20px;
      color: #e0e7ff;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    #ui-panel h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #7dd3fc;
      letter-spacing: -0.5px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group input[type="text"],
    .control-group select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(37, 49, 60, 0.8);
      border: 1px solid #3b82f6;
      border-radius: 10px;
      color: #e0e7ff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .control-group input[type="text"]:focus,
    .control-group select:focus {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .control-group input[type="text"]::placeholder {
      color: #475569;
    }

    .control-group select option {
      background: #1e293b;
      color: #e0e7ff;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-row input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(59, 130, 246, 0.3);
      border-radius: 3px;
      outline: none;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
    }

    .slider-row input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #7dd3fc;
      border-radius: 50%;
      cursor: pointer;
    }

    .value-display {
      font-size: 12px;
      color: #94a3b8;
      min-width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .slider-row input[type="range"] + .value-display {
      color: #7dd3fc;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px 14px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      border-radius: 10px;
      color: #e0e7ff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: rgba(59, 130, 246, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: #3b82f6;
    }

    button.primary:hover {
      background: #7dd3fc;
      color: #1e293b;
    }

    .info-panel {
      margin-top: 16px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 8px;
      font-size: 12px;
      color: #7dd3fc;
      line-height: 1.6;
    }

    .info-panel code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
    }

    .error-message {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
    }

    .hint {
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
      padding-left: 4px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h1>📊 3D Function Visualizer</h1>

    <div class="control-group">
      <label for="function-input">Function f(x, y) = </label>
      <input type="text" id="function-input" placeholder="e.g., sin(x)*cos(y)" value="sin(x)*cos(y)" />
    </div>

    <div class="control-group">
      <label for="domain-x">X Domain</label>
      <div class="slider-row">
        <input type="range" id="domain-x-min" min="-10" max="10" step="0.5" value="-5" />
        <span class="value-display"><span id="x-min-val">-5</span></span>
      </div>
      <div class="slider-row">
        <input type="range" id="domain-x-max" min="-10" max="10" step="0.5" value="5" />
        <span class="value-display"><span id="x-max-val">5</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="domain-y">Y Domain</label>
      <div class="slider-row">
        <input type="range" id="domain-y-min" min="-10" max="10" step="0.5" value="-5" />
        <span class="value-display"><span id="y-min-val">-5</span></span>
      </div>
      <div class="slider-row">
        <input type="range" id="domain-y-max" min="-10" max="10" step="0.5" value="5" />
        <span class="value-display"><span id="y-max-val">5</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="resolution">Resolution (samples)</label>
      <div class="slider-row">
        <input type="range" id="resolution" min="10" max="200" step="5" value="30" />
        <span class="value-display"><span id="res-val">30</span></span>
      </div>
    </div>

    <div class="control-group">
      <label for="color-mode">Color Mode</label>
      <select id="color-mode">
        <option value="height">By Height (Z)</option>
        <option value="gradient">Gradient (Blue→Red)</option>
        <option value="wireframe">Wireframe Only</option>
      </select>
    </div>

    <div class="control-group">
      <label for="opacity">Surface Opacity</label>
      <div class="slider-row">
        <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.85" />
        <span class="value-display"><span id="op-val">0.85</span></span>
      </div>
    </div>

    <div class="btn-group">
      <button id="reset-view">Reset View</button>
      <button id="auto-rotate">Auto Rotate</button>
    </div>

    <div class="info-panel" id="info-panel">
      Function: sin(x)·cos(y)
    </div>

    <p class="hint">🖱️ Left-drag to rotate • Scroll to zoom • Right-drag to pan</p>
  </div>

  <!-- Load Three.js as global (more reliable with CDNs) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</function>
